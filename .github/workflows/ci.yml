name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A run takes about 5 minutes; a hang must not hold a runner for GitHub's default 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The CPU torch wheel is ~200 MB; setup-python caches pip downloads keyed on the requirements file.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements-dev.txt

      - name: Python environment (python/.venv, as the scripts expect)
        shell: bash
        run: |
          python -m venv python/.venv
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python/.venv/Scripts/python; else PY=python/.venv/bin/python; fi
          $PY -m pip install --upgrade pip
          $PY -m pip install -r python/requirements-dev.txt

      - run: npm ci

      - name: Spec manifest is up to date
        shell: bash
        run: |
          npm run specs
          git diff --exit-code python/neuroloom/specs.json

      - run: npm run typecheck
      - run: npm test
      - run: npm run test:py

      - name: Desktop build and smoke test
        shell: bash
        run: |
          node node_modules/electron/install.js
          npm run build:desktop
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a npm run smoke; else npm run smoke; fi

      - name: Smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}
          path: apps/desktop/dist/smoke.png
          if-no-files-found: ignore
